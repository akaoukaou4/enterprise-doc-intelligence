[project]
name = "enterprise-doc-intelligence"
version = "0.1.0"
description = "Enterprise document intelligence platform with RAG and cited answers"
readme = "README.md"
authors = [
    { name = "akaoukaou", email = "ayoubkoukaou07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.107",
    "docling>=2.133.0",
    "fastapi>=0.142.2",
    "pgvector>=0.5.0",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic generates these files; they are not hand-written code.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

# PyTorch is installed from the CPU-only index (no CUDA download).
# This only applies to torch and torchvision when they are listed in
# the dependencies above, which `uv add` does for us.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
